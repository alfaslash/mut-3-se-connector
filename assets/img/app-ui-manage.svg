<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="100%" height="100%" style="font-family: 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="820" height="620" rx="8" fill="#F3F3F3" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="820" height="36" rx="8" fill="#FFFFFF"/>
  <rect x="0" y="30" width="820" height="6" fill="#FFFFFF"/>
  <line x1="0" y1="36" x2="820" y2="36" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Title Icon & Text -->
  <rect x="14" y="9" width="18" height="18" rx="4" fill="#0067C0"/>
  <text x="23" y="22" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">M</text>
  <text x="38" y="22" font-size="12" fill="#5C5C5C">MUT-3 Connector — Adapter management (v1.7.0)</text>

  <!-- Window Buttons -->
  <circle cx="754" cy="18" r="5" fill="#E5E7EB"/>
  <circle cx="774" cy="18" r="5" fill="#E5E7EB"/>
  <circle cx="794" cy="18" r="5" fill="#EF4444" opacity="0.8"/>

  <!-- Tab Control -->
  <rect x="24" y="44" width="772" height="34" fill="transparent"/>
  
  <!-- Tab 1: Manage (Active) -->
  <text x="44" y="66" font-size="13" font-weight="600" fill="#0067C0">Manage</text>
  <rect x="36" y="75" width="60" height="3" rx="1.5" fill="#0067C0"/>

  <!-- Tab 2: Diagnostics -->
  <text x="126" y="66" font-size="13" font-weight="500" fill="#5C5C5C">Diagnostics</text>

  <!-- Tab 3: Tools (Reprog) -->
  <text x="226" y="66" font-size="13" font-weight="500" fill="#5C5C5C">Tools</text>

  <!-- Tab 4: Instructions -->
  <text x="290" y="66" font-size="13" font-weight="500" fill="#5C5C5C">Instructions</text>

  <!-- Tab 5: About -->
  <text x="390" y="66" font-size="13" font-weight="500" fill="#5C5C5C">About</text>

  <line x1="24" y1="78" x2="796" y2="78" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Hero Band -->
  <rect x="24" y="92" width="772" height="64" rx="6" fill="#EAF3FB" stroke="#BCD9F0" stroke-width="1"/>
  <rect x="38" y="104" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#BCD9F0" stroke-width="1"/>
  <!-- Gear Icon -->
  <path d="M58 116a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm-8 4a8 8 0 1 1 16 0 8 8 0 0 1-16 0z" fill="#0067C0"/>
  <text x="90" y="120" font-size="15" font-weight="600" fill="#1B1B1B">Adapter profile management</text>
  <text x="90" y="138" font-size="12" fill="#5C5C5C">Configure MUT-III SE with any J2534 Pass-Thru adapter</text>

  <!-- License Badge right -->
  <rect x="710" y="108" width="72" height="28" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
  <text x="746" y="126" font-size="11" fill="#5C5C5C" text-anchor="middle">✓ Licensed</text>

  <!-- Adapter Selection Card -->
  <rect x="24" y="170" width="772" height="74" rx="8" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#shadow)"/>
  <text x="40" y="192" font-size="11" font-weight="600" fill="#5C5C5C" letter-spacing="0.5">ADAPTER</text>
  <!-- Dropdown -->
  <rect x="40" y="202" width="740" height="34" rx="4" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1"/>
  <text x="52" y="224" font-size="13" font-weight="600" fill="#1B1B1B">Scanmatik 2 PRO (SM2-USB) — J2534-1 v04.04</text>
  <path d="M764 218l-4 4-4-4h8z" fill="#5C5C5C"/>

  <!-- Middle Row: Backup Management & System Check -->
  <g transform="translate(24, 258)">
    <!-- Backup Card -->
    <rect x="0" y="0" width="376" height="88" rx="8" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#shadow)"/>
    <text x="16" y="22" font-size="11" font-weight="600" fill="#5C5C5C" letter-spacing="0.5">BACKUP MANAGEMENT</text>
    <rect x="16" y="34" width="130" height="34" rx="4" fill="#0067C0"/>
    <text x="81" y="56" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Create backup</text>
    <rect x="156" y="34" width="110" height="34" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="211" y="56" font-size="12" font-weight="500" fill="#1B1B1B" text-anchor="middle">Restore</text>
    <text x="16" y="78" font-size="10" fill="#8A8A8A">Last backup: PassThruSupport.04.04.reg (saved)</text>

    <!-- System Check Card -->
    <rect x="396" y="0" width="376" height="88" rx="8" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#shadow)"/>
    <text x="412" y="22" font-size="11" font-weight="600" fill="#5C5C5C" letter-spacing="0.5">SYSTEM CHECK</text>
    <rect x="412" y="34" width="170" height="34" rx="4" fill="#107C10"/>
    <text x="497" y="56" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">✓ Check VCI driver</text>
    <text x="412" y="78" font-size="10" fill="#107C10">Bosch RNM-VI driver is correctly registered</text>
  </g>

  <!-- Apply Settings Card -->
  <g transform="translate(24, 360)">
    <rect x="0" y="0" width="772" height="72" rx="8" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#shadow)"/>
    <text x="16" y="22" font-size="11" font-weight="600" fill="#5C5C5C" letter-spacing="0.5">APPLY SETTINGS</text>
    <rect x="16" y="32" width="230" height="34" rx="4" fill="#0067C0"/>
    <text x="131" y="54" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Configure MUT-III with SM2-USB</text>
    <text x="260" y="53" font-size="12" fill="#107C10">✓ Profile applied to registry. Ready for diagnostics.</text>
  </g>

  <!-- Operation Log (Terminal) -->
  <g transform="translate(24, 446)">
    <rect x="0" y="0" width="772" height="154" rx="6" fill="#1C1C1C" stroke="#2A2A2A" stroke-width="1"/>
    
    <!-- Header -->
    <text x="16" y="22" font-size="11" font-weight="600" fill="#D4D4D4">Operation log</text>
    <rect x="650" y="9" width="50" height="20" rx="3" fill="#2A2A2A"/>
    <text x="675" y="23" font-size="10" fill="#9A9A9A" text-anchor="middle">Save</text>
    <rect x="708" y="9" width="50" height="20" rx="3" fill="#2A2A2A"/>
    <text x="733" y="23" font-size="10" fill="#9A9A9A" text-anchor="middle">Clear</text>
    <line x1="0" y1="34" x2="772" y2="34" stroke="#2A2A2A" stroke-width="1"/>

    <!-- Log Lines -->
    <g font-family="'Cascadia Code', Consolas, monospace" font-size="11">
      <text x="16" y="54" fill="#7A7A7A">[14:26:08]</text>
      <text x="96" y="54" fill="#85D996">✓ Driver registration and DLL files (sm2j2534.dll) verified successfully.</text>

      <text x="16" y="74" fill="#7A7A7A">[14:26:10]</text>
      <text x="96" y="74" fill="#9EC5FE">== MUT-III SE configuration initiated: Scanmatik 2 PRO ==</text>

      <text x="16" y="94" fill="#7A7A7A">[14:26:11]</text>
      <text x="96" y="94" fill="#85D996">✓ PassThruSupport.04.04 key updated with Bosch RNM-VI alias.</text>

      <text x="16" y="114" fill="#7A7A7A">[14:26:12]</text>
      <text x="96" y="114" fill="#85D996">✓ Pajero 4 ABS/ASC K-Line timing fix applied (50ms Fast Init shim active).</text>

      <text x="16" y="134" fill="#7A7A7A">[14:26:15]</text>
      <text x="96" y="134" fill="#85D996">✓ All operations completed. You may now launch Mitsubishi MUT-III SE.</text>
    </g>
  </g>
</svg>
