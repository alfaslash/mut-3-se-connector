<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="100%" height="100%" style="font-family: 'Segoe UI', -apple-system, sans-serif;">
  <defs>
    <filter id="shadow-diag-ru" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="820" height="620" rx="8" fill="#F3F3F3" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Title Bar -->
  <rect x="0" y="0" width="820" height="36" rx="8" fill="#FFFFFF"/>
  <rect x="0" y="30" width="820" height="6" fill="#FFFFFF"/>
  <line x1="0" y1="36" x2="820" y2="36" stroke="#E5E7EB" stroke-width="1"/>
  
  <rect x="14" y="9" width="18" height="18" rx="4" fill="#0067C0"/>
  <text x="23" y="22" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">M</text>
  <text x="38" y="22" font-size="12" fill="#5C5C5C">MUT-3 Connector — Центр совместимости J2534</text>

  <!-- Window Buttons -->
  <circle cx="754" cy="18" r="5" fill="#E5E7EB"/>
  <circle cx="774" cy="18" r="5" fill="#E5E7EB"/>
  <circle cx="794" cy="18" r="5" fill="#EF4444" opacity="0.8"/>

  <!-- Tab Control -->
  <text x="44" y="66" font-size="13" font-weight="500" fill="#5C5C5C">Управление</text>
  
  <!-- Tab 2: Диагностика (Active) -->
  <text x="144" y="66" font-size="13" font-weight="600" fill="#0067C0">Диагностика</text>
  <rect x="136" y="75" width="94" height="3" rx="1.5" fill="#0067C0"/>

  <text x="254" y="66" font-size="13" font-weight="500" fill="#5C5C5C">Инструменты</text>
  <text x="364" y="66" font-size="13" font-weight="500" fill="#5C5C5C">Инструкция</text>
  <text x="468" y="66" font-size="13" font-weight="500" fill="#5C5C5C">О программе</text>

  <line x1="24" y1="78" x2="796" y2="78" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Hero Band -->
  <rect x="24" y="92" width="772" height="64" rx="6" fill="#EAF3FB" stroke="#BCD9F0" stroke-width="1"/>
  <rect x="38" y="104" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#BCD9F0" stroke-width="1"/>
  <path d="M58 114l-8 3v6c0 5 3.5 9.5 8 11 4.5-1.5 8-6 8-11v-6l-8-3z" fill="#0067C0"/>
  <text x="90" y="120" font-size="15" font-weight="600" fill="#1B1B1B">Центр совместимости J2534 и активный тест связи</text>
  <text x="90" y="138" font-size="12" fill="#5C5C5C">Проверка всей цепочки: от регистрации в реестре до открытия адаптера по USB</text>

  <!-- Probe Action Bar -->
  <g transform="translate(24, 168)">
    <rect x="0" y="0" width="772" height="56" rx="8" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#shadow-diag-ru)"/>
    <rect x="16" y="11" width="190" height="34" rx="4" fill="#0067C0"/>
    <text x="111" y="33" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">⚡ Выполнить полную проверку</text>

    <rect x="218" y="11" width="190" height="34" rx="4" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1"/>
    <text x="313" y="33" font-size="12" font-weight="500" fill="#1B1B1B" text-anchor="middle">Экспорт отчёта диагностики</text>

    <text x="756" y="34" font-size="13" font-weight="600" fill="#107C10" text-anchor="end">● Проверка пройдена</text>
  </g>

  <!-- Checks List Grid -->
  <g transform="translate(24, 238)">
    <!-- Check Item 1: Registry -->
    <rect x="0" y="0" width="772" height="52" rx="6" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="28" cy="26" r="10" fill="#E6F4EA"/>
    <text x="28" y="30" font-size="11" font-weight="bold" fill="#107C10" text-anchor="middle">✓</text>
    <text x="50" y="24" font-size="13" font-weight="600" fill="#1B1B1B">Регистрация в реестре Windows (PassThruSupport.04.04)</text>
    <text x="50" y="40" font-size="11" fill="#5C5C5C">Раздел HKLM\SOFTWARE\WOW6432Node\PassThruSupport.04.04\SM2-USB проверен</text>
    <text x="756" y="31" font-size="12" font-weight="600" fill="#107C10" text-anchor="end">ГОТОВО</text>

    <!-- Check Item 2: 32-bit DLL -->
    <rect x="0" y="60" width="772" height="52" rx="6" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="28" cy="86" r="10" fill="#E6F4EA"/>
    <text x="28" y="90" font-size="11" font-weight="bold" fill="#107C10" text-anchor="middle">✓</text>
    <text x="50" y="84" font-size="13" font-weight="600" fill="#1B1B1B">32-битная библиотека J2534 (FunctionLibrary)</text>
    <text x="50" y="100" font-size="11" fill="#5C5C5C">C:\Program Files (x86)\Scanmatik\sm2j2534.dll является корректной x86 DLL</text>
    <text x="756" y="91" font-size="12" font-weight="600" fill="#107C10" text-anchor="end">СОВМЕСТИМО</text>

    <!-- Check Item 3: Hardware USB Handshake -->
    <rect x="0" y="120" width="772" height="52" rx="6" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    <circle cx="28" cy="146" r="10" fill="#E6F4EA"/>
    <text x="28" y="150" font-size="11" font-weight="bold" fill="#107C10" text-anchor="middle">✓</text>
    <text x="50" y="144" font-size="13" font-weight="600" fill="#1B1B1B">Изолированный аппаратный тест связи (PassThruOpen / Close)</text>
    <text x="50" y="160" font-size="11" fill="#5C5C5C">Устройство #1 успешно открыто по USB; интерфейс J2534 04.04 подтверждён</text>
    <text x="756" y="151" font-size="12" font-weight="600" fill="#107C10" text-anchor="end">ПОДКЛЮЧЕНО</text>

    <!-- Protocols Card -->
    <rect x="0" y="182" width="772" height="176" rx="8" fill="#FFFFFF" stroke="rgba(0,0,0,0.08)" stroke-width="1" filter="url(#shadow-diag-ru)"/>
    <text x="18" y="206" font-size="12" font-weight="600" fill="#5C5C5C" letter-spacing="0.5">ПРОТОКОЛЫ, ЗАЯВЛЕННЫЕ ДРАЙВЕРОМ АДАПТЕРА</text>
    
    <g transform="translate(18, 222)">
      <!-- Protocol Chips -->
      <rect x="0" y="0" width="130" height="28" rx="4" fill="#E6F4EA" stroke="#BDE0BD"/>
      <text x="12" y="18" font-size="11" font-weight="600" fill="#107C10">● CAN (ISO 11898)</text>

      <rect x="142" y="0" width="140" height="28" rx="4" fill="#E6F4EA" stroke="#BDE0BD"/>
      <text x="154" y="18" font-size="11" font-weight="600" fill="#107C10">● ISO 15765 (CAN TP)</text>

      <rect x="294" y="0" width="130" height="28" rx="4" fill="#E6F4EA" stroke="#BDE0BD"/>
      <text x="306" y="18" font-size="11" font-weight="600" fill="#107C10">● ISO 9141 (K-Line)</text>

      <rect x="436" y="0" width="140" height="28" rx="4" fill="#E6F4EA" stroke="#BDE0BD"/>
      <text x="448" y="18" font-size="11" font-weight="600" fill="#107C10">● ISO 14230 (KWP2000)</text>

      <rect x="588" y="0" width="140" height="28" rx="4" fill="#E6F4EA" stroke="#BDE0BD"/>
      <text x="600" y="18" font-size="11" font-weight="600" fill="#107C10">● J1850 PWM / VPW</text>
    </g>

    <text x="18" y="280" font-size="11" fill="#8A8A8A">Рекомендация ассистента: Блокирующих проблем совместимости не обнаружено. Оборудование готово к запуску MUT-III SE.</text>
  </g>
</svg>
